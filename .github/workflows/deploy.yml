name: "CI and deploy"

on:
    push:
        branches:
            - main
    workflow_dispatch:
    pull_request:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python 3.13
              uses: actions/setup-python@v7
              with:
                  python-version: '3.13'
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
            - name: Run tests
              run: |
                  python app/manage.py check
                  python app/manage.py test tests
                  node --test tests/*test.cjs
    publish:
        runs-on: ubuntu-latest
        needs: test
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7
            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                context: .
                file: Dockerfile
                push: true
                tags: ghcr.io/${{ github.repository_owner }}/pyforge:${{ github.sha}}
                labels: |
                    org.opencontainers.image.source=https://github.com/whistyx1/PyForge

    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 75
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        needs: publish
        concurrency:
            group: pyforge-production-deploy
            cancel-in-progress: false
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Check whether this commit is still main
              id: current
              env:
                GH_TOKEN: ${{ github.token }}
              run: |
                set -euo pipefail
                latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
                [[ "$latest_sha" =~ ^[0-9a-f]{40}$ ]]
                if [[ "$latest_sha" == "$GITHUB_SHA" ]]; then
                    echo 'deploy=true' >> "$GITHUB_OUTPUT"
                else
                    echo 'deploy=false' >> "$GITHUB_OUTPUT"
                    echo "Skipping obsolete deployment for $GITHUB_SHA; main is $latest_sha"
                fi
            - name: Configure AWS credentials
              if: steps.current.outputs.deploy == 'true'
              uses: aws-actions/configure-aws-credentials@v6.3.0
              with:
                role-to-assume: arn:aws:iam::266294231268:role/pyforge-github-deploy
                aws-region: us-east-1

            - name: Detect server configuration changes
              id: server_config
              if: steps.current.outputs.deploy == 'true'
              env:
                PUSH_BEFORE: ${{ github.event.before }}
              run: |
                set -euo pipefail
                if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
                    configure="$(python infra/ansible/should_configure.py workflow_dispatch </dev/null)"
                else
                    changed="$(git diff --name-only "$PUSH_BEFORE" "$GITHUB_SHA")"
                    configure="$(printf '%s\n' "$changed" | python infra/ansible/should_configure.py push)"
                fi
                echo "configure=$configure" >> "$GITHUB_OUTPUT"

            - name: Install Ansible SSM dependencies
              if: steps.server_config.outputs.configure == 'true'
              run: |
                python -m pip install ansible boto3 botocore
                ansible-galaxy collection install amazon.aws
                curl -fsSL https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb -o /tmp/session-manager-plugin.deb
                sudo dpkg -i /tmp/session-manager-plugin.deb

            - name: Configure server with Ansible
              if: steps.server_config.outputs.configure == 'true'
              env:
                ANSIBLE_AWS_SSM_BUCKET_NAME: pyforge-backups-266294231268-us-east-1
              run: |
                ansible-inventory -i infra/ansible/inventory.ssm.aws_ec2.yml --list | python -c 'import json,sys; hosts=json.load(sys.stdin).get("pyforge",{}).get("hosts",[]); assert len(hosts)==1, "Expected exactly one PyForge server"'
                ansible-playbook -i infra/ansible/inventory.ssm.aws_ec2.yml infra/ansible/site.yml \
                    -e ansible_connection=amazon.aws.aws_ssm \
                    -e ansible_python_interpreter=/usr/bin/python3 \
                    -e ansible_aws_ssm_bucket_name="$ANSIBLE_AWS_SSM_BUCKET_NAME" \
                    -e ansible_aws_ssm_region=us-east-1

            - name: Copy GitHub secret to Parameter Store
              if: steps.current.outputs.deploy == 'true'
              env:
                DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
                DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
              run: |
                test -n "$DUCKDNS_TOKEN"
                aws ssm put-parameter \
                    --name /pyforge/production/DJANGO_SECRET_KEY \
                    --value "${DJANGO_SECRET_KEY}" \
                    --type SecureString \
                    --overwrite \
                    --region us-east-1

                aws ssm put-parameter \
                    --name /pyforge/production/DUCKDNS_TOKEN \
                    --value "$DUCKDNS_TOKEN" \
                    --type SecureString \
                    --overwrite \
                    --region us-east-1

            - name: Deploy with SSM
              if: steps.current.outputs.deploy == 'true'
              run: |

                instance_id="$(aws ec2 describe-instances \
                --region us-east-1 \
                --filters "Name=tag:Name,Values=pyforge-lab-server" "Name=instance-state-name,Values=running" \
                --query 'Reservations[0].Instances[0].InstanceId' \
                --output text)"

                command_id="$(aws ssm send-command \
                    --instance-ids "$instance_id" \
                    --document-name "AWS-RunShellScript" \
                    --comment "Deploy PyForge" \
                    --timeout-seconds 600 \
                    --parameters "commands=[\"/usr/local/bin/pyforge-deploy ${GITHUB_SHA}\"],executionTimeout=[\"3600\"]" \
                    --region us-east-1 \
                    --query 'Command.CommandId' \
                    --output text)"

                deadline=$((SECONDS + 4320))
                while (( SECONDS < deadline )); do
                    if status="$(aws ssm get-command-invocation \
                        --command-id "$command_id" \
                        --instance-id "$instance_id" \
                        --region us-east-1 \
                        --query StatusDetails \
                        --output text 2>/dev/null)"; then
                        case "$status" in
                            Success)
                                echo "Deployment command $command_id succeeded"
                                exit 0
                                ;;
                            Failed|Cancelled|TimedOut|"Delivery Timed Out"|"Execution Timed Out"|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated|"Invalid Platform"|InvalidPlatform|"Access Denied"|AccessDenied)
                                echo "Deployment command $command_id ended: $status" >&2
                                aws ssm get-command-invocation \
                                    --command-id "$command_id" \
                                    --instance-id "$instance_id" \
                                    --region us-east-1 \
                                    --query '[StandardOutputContent,StandardErrorContent]' \
                                    --output text >&2 || true
                                exit 1
                                ;;
                            Pending|"In Progress"|InProgress|Delayed|Cancelling)
                                ;;
                            *)
                                echo "Waiting for unrecognized SSM status: $status" >&2
                                ;;
                        esac
                    else
                        echo "Waiting for SSM invocation $command_id to become available" >&2
                    fi
                    sleep 5
                done
                echo "SSM invocation $command_id did not reach a terminal status within 72 minutes" >&2
                exit 1
