- name: Configure PyForge server
  hosts: pyforge
  become: true

  tasks:
    - name: Install Docker repository prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - python3-debian
          - unzip
          - util-linux
        state: present
        update_cache: true

    - name: Add Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        signed_by: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Install Docker Engine and Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Download AWS CLI Installer
      ansible.builtin.get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
        mode: '0644'

    - name: Unpack AWS CLI Installer
      ansible.builtin.unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp/
        remote_src: true
        creates: /tmp/aws/install

    - name: Install AWS CLI
      ansible.builtin.command:
        cmd: /tmp/aws/install --install-dir /usr/local/aws-cli --bin-dir /usr/local/bin
        creates: /usr/local/bin/aws

    - name: Start Docker and enable it at boot
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Create PyForge directory
      ansible.builtin.file:
        state: directory
        path: /opt/pyforge
        owner: root
        mode: '0755'

    - name: Ensure the runtime lock directory exists
      ansible.builtin.file:
        path: /run/lock
        state: directory

    - name: Create Compose for Server
      ansible.builtin.template:
        src: templates/compose.yaml.j2
        dest: /opt/pyforge/compose.yaml
        owner: root
        mode: '0644'

    - name: Install PyForge deploy script
      ansible.builtin.copy:
        src: files/pyforge-deploy
        dest: /usr/local/bin/pyforge-deploy
        owner: root
        group: root
        mode: '0750'

    - name: Install PyForge backup script
      ansible.builtin.copy:
        src: files/pyforge-backup
        dest: /usr/local/bin/pyforge-backup
        owner: root
        group: root
        mode: '0750'

    - name: Install PyForge restore script
      ansible.builtin.copy:
        src: files/pyforge-restore
        dest: /usr/local/bin/pyforge-restore
        owner: root
        group: root
        mode: '0750'

    - name: Install PyForge backup service
      ansible.builtin.template:
        src: templates/pyforge-backup.service.j2
        dest: /etc/systemd/system/pyforge-backup.service
        owner: root
        group: root
        mode: '0644'

    - name: Install PyForge backup timer
      ansible.builtin.template:
        src: templates/pyforge-backup.timer.j2
        dest: /etc/systemd/system/pyforge-backup.timer
        owner: root
        group: root
        mode: '0644'

    - name: Enable and start the PyForge backup timer
      ansible.builtin.systemd_service:
        name: pyforge-backup.timer
        daemon_reload: true
        enabled: true
        state: started

    - name: Add Caddy repository
      ansible.builtin.deb822_repository:
        name: caddy
        types: deb
        uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
        suites: any-version
        components: main
        signed_by: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
        state: present

    - name: Install Caddy package
      ansible.builtin.apt:
        name: caddy
        state: present
        update_cache: true

    - name: Start Caddy and enable it at boot
      ansible.builtin.systemd_service:
        name: caddy
        state: started
        enabled: true

    - name: Check whether the previous IP certificate timer is installed
      ansible.builtin.stat:
        path: /etc/systemd/system/certbot-renew.timer
      register: pyforge_old_certbot_timer

    - name: Disable the previous IP certificate renewal timer
      ansible.builtin.systemd_service:
        name: certbot-renew.timer
        state: stopped
        enabled: false
        daemon_reload: true
      when: pyforge_old_certbot_timer.stat.exists

    - name: Remove the previous Certbot systemd units
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/certbot-renew.service
        - /etc/systemd/system/certbot-renew.timer
      register: pyforge_old_certbot_units

    - name: Reload systemd after removing Certbot units
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: pyforge_old_certbot_units.changed

    - name: Install DuckDNS updater
      ansible.builtin.copy:
        src: files/pyforge-update-duckdns
        dest: /usr/local/bin/pyforge-update-duckdns
        owner: root
        group: root
        mode: '0750'

    - name: Install DuckDNS update service
      ansible.builtin.template:
        src: templates/duckdns-update.service.j2
        dest: /etc/systemd/system/duckdns-update.service
        owner: root
        group: root
        mode: '0644'

    - name: Install DuckDNS update timer
      ansible.builtin.template:
        src: templates/duckdns-update.timer.j2
        dest: /etc/systemd/system/duckdns-update.timer
        owner: root
        group: root
        mode: '0644'

    - name: Enable and start the DuckDNS update timer
      ansible.builtin.systemd_service:
        name: duckdns-update.timer
        daemon_reload: true
        enabled: true
        state: started

    - name: Update DuckDNS with the server public IP now
      ansible.builtin.command:
        cmd: "/usr/local/bin/pyforge-update-duckdns {{ pyforge_duckdns_subdomain }}"
      changed_when: false

    - name: Install Caddy HTTPS configuration
      ansible.builtin.template:
        src: templates/Caddyfile.j2
        dest: /etc/caddy/Caddyfile
        owner: root
        group: root
        mode: '0644'
      register: pyforge_caddyfile

    - name: Validate Caddy configuration
      ansible.builtin.command:
        cmd: caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      changed_when: false

    - name: Reload Caddy with HTTPS configuration
      ansible.builtin.systemd_service:
        name: caddy
        state: reloaded
      when: pyforge_caddyfile.changed
