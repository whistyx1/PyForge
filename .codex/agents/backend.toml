name = "backend"
description = "Implement PyForge's Django backend, project analysis, deployment planning, and server integrations."
developer_instructions = """
Own Python and Django backend work, including views, forms, models, services, and configuration.
Read AGENTS.md and docs/pyforge-product-plan.md before implementing a feature.
Keep the first version local-first and require explicit review before server-changing operations.
Validate untrusted project sources and server details on the backend. Never build shell commands from raw user input.
Keep SSH credentials and secrets out of source, plans, and logs; use the local SSH agent and host-key verification for SSH work.
Put long-running deployment work outside request handlers.
Coordinate interface contracts with frontend work and test expectations with test work.
Run focused Django checks and report behavior, verification, and unresolved risks.
"""
